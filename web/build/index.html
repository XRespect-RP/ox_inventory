<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xrespect - Inventory</title>
    <link rel="stylesheet" href="./assets/dopa-style-bdbdbd.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="inventory-container" class="inventory-container hidden">
        <!-- Animated background particles -->
        <div class="particles" id="particles"></div>

        <!-- Top Brand Bar -->
        <div class="brand-bar">
            <div class="brand-logo">
                <img class="brand-icon brand-icon-image" src="./assets/logoxrespect/xrespectXlogo.png" alt="Xrespect logo">
                <span class="brand-text">Xrespect</span>
                <span class="brand-separator">|</span>
                <span class="brand-sub">Inventory</span>
            </div>
            <div class="brand-close" id="close-btn" title="Close (ESC)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </div>
        </div>

        <!-- Main Inventory Layout -->
        <div class="inventory-layout">
            <!-- Player Inventory -->
            <div class="inventory-panel player-panel" id="player-panel">
                <div class="panel-header">
                    <div class="panel-info">
                        <div class="panel-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div class="panel-details">
                            <span class="panel-title" id="player-name">Player Inventory</span>
                            <span class="panel-subtitle" id="player-id">ID: 1</span>
                        </div>
                    </div>
                    <div class="panel-weight">
                        <div class="weight-info">
                            <span class="weight-current" id="player-weight-text">0</span>
                            <span class="weight-separator">/</span>
                            <span class="weight-max" id="player-weight-max">120</span>
                            <span class="weight-unit">kg</span>
                        </div>
                        <div class="weight-bar-container">
                            <div class="weight-bar" id="player-weight-bar" style="width: 0%"></div>
                            <div class="weight-bar-glow" id="player-weight-glow" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="panel-search">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" class="search-input" id="player-search" placeholder="Search items...">
                </div>
                <div class="slots-container" id="player-slots">
                    <!-- Slots generated by JS -->
                </div>
            </div>

            <!-- Center Action Bar -->
            <div class="action-bar" id="action-bar">
                <div class="action-divider"></div>
                <div class="action-amount-wrapper">
                    <input type="number" class="action-amount" id="action-amount" value="0" min="0">
                    <span class="action-amount-label">QTY</span>
                </div>
                <button class="action-btn" id="btn-use" title="Use Item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19V5"/>
                        <path d="M5 12l7 7 7-7"/>
                    </svg>
                    <span>Use</span>
                </button>
                <button class="action-btn" id="btn-give" title="Give Item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 1l4 4-4 4"/>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                        <path d="M7 23l-4-4 4-4"/>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                    </svg>
                    <span>Give</span>
                </button>
                <button class="action-btn action-btn-drop" id="btn-drop" title="Drop Item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    <span>Drop</span>
                </button>
                <button class="action-btn" id="btn-info" title="Item Info">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <span>Info</span>
                </button>
                <div class="action-divider"></div>
            </div>

            <!-- Secondary Inventory -->
            <div class="inventory-panel secondary-panel" id="secondary-panel">
                <div class="panel-header">
                    <div class="panel-info">
                        <div class="panel-avatar secondary-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                                <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                            </svg>
                        </div>
                        <div class="panel-details">
                            <span class="panel-title" id="secondary-name">Secondary</span>
                            <span class="panel-subtitle" id="secondary-id">Container</span>
                        </div>
                    </div>
                    <div class="panel-weight">
                        <div class="weight-info">
                            <span class="weight-current" id="secondary-weight-text">0</span>
                            <span class="weight-separator">/</span>
                            <span class="weight-max" id="secondary-weight-max">120</span>
                            <span class="weight-unit">kg</span>
                        </div>
                        <div class="weight-bar-container">
                            <div class="weight-bar secondary-bar" id="secondary-weight-bar" style="width: 0%"></div>
                            <div class="weight-bar-glow secondary-glow" id="secondary-weight-glow" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="panel-search">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" class="search-input" id="secondary-search" placeholder="Search items...">
                </div>
                <div class="slots-container" id="secondary-slots">
                    <!-- Slots generated by JS -->
                </div>
            </div>
        </div>

        <!-- Item Tooltip -->
        <div class="item-tooltip hidden" id="item-tooltip">
            <div class="tooltip-header">
                <span class="tooltip-name" id="tooltip-name">Item Name</span>
                <span class="tooltip-rarity" id="tooltip-rarity">Common</span>
            </div>
            <div class="tooltip-divider"></div>
            <div class="tooltip-body">
                <p class="tooltip-desc" id="tooltip-desc">Item description goes here.</p>
                <div class="tooltip-stats">
                    <div class="tooltip-stat">
                        <span class="stat-label">Weight</span>
                        <span class="stat-value" id="tooltip-weight">0.0 kg</span>
                    </div>
                    <div class="tooltip-stat">
                        <span class="stat-label">Amount</span>
                        <span class="stat-value" id="tooltip-amount">x1</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Context Menu -->
        <div class="context-menu hidden" id="context-menu">
            <button class="context-item" data-action="use">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5"/><path d="M5 12l7 7 7-7"/></svg>
                <span>Use</span>
            </button>
            <button class="context-item" data-action="give">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/></svg>
                <span>Give</span>
            </button>
            <div class="context-divider"></div>
            <button class="context-item context-danger" data-action="drop">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>Drop</span>
            </button>
        </div>

        <!-- Give Target Modal -->
        <div class="give-modal hidden" id="give-modal">
            <div class="give-modal-header">
                <div class="give-modal-heading">
                    <span class="give-modal-title">Give Item</span>
                    <span class="give-modal-subtitle" id="give-modal-subtitle">Detecting nearby IDs...</span>
                </div>
                <div class="give-modal-keys">
                    <span>W/S</span>
                    <span>Enter</span>
                    <span>Esc</span>
                </div>
            </div>
            <div class="give-modal-item">
                <span class="give-modal-item-name" id="give-item-name">No item selected</span>
                <span class="give-modal-item-count" id="give-item-count">x0</span>
            </div>
            <div class="give-target-list" id="give-target-list"></div>
        </div>

        <!-- Drag Ghost -->
        <div class="drag-ghost hidden" id="drag-ghost">
            <img id="drag-ghost-img" src="" alt="">
            <span class="drag-ghost-count" id="drag-ghost-count">x1</span>
        </div>

        <!-- Notification Toast -->
        <div class="toast-container" id="toast-container"></div>
    </div>

    <script src="./assets/dopa-script.js"></script>
</body>
</html>
